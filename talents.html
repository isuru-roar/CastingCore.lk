<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talent Directory - CastingCore</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .directory-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 2rem;
      margin: 2rem auto;
      align-items: start;
    }
    
    .filter-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      position: sticky;
      top: 80px;
    }
    
    .filter-panel h3 {
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-color);
    }
    
    .filter-group {
      margin-bottom: 1.5rem;
    }
    
    .filter-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }
    
    /* Was input[type="text"] only, which left the Min/Max age boxes as
       default white-on-black system inputs inside a dark panel. */
    .filter-group select,
    .filter-group input:not([type="checkbox"]):not([type="radio"]) {
      width: 100%;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--border-color);
      color: white;
      padding: 0.5rem;
      border-radius: 6px;
      font-family: inherit;
    }

    .filter-group select:focus, .filter-group input:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    

    
  </style>
</head>
<body>

  <div data-site-nav></div>

<div class="container directory-layout">
    <aside class="filter-panel">
      <h3>Filters</h3>
      <form id="filter-form">
        <div class="filter-group">
          <label>Search Name</label>
          <input type="text" id="search-name" placeholder="E.g., Elena">
        </div>
        
        <div class="filter-group">
          <label>Gender</label>
          <select id="filter-gender">
            <option value="">Any</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Age Range</label>
          <div style="display: flex; gap: 0.5rem;">
            <input type="number" id="filter-min-age" placeholder="Min" style="width: 50%;">
            <input type="number" id="filter-max-age" placeholder="Max" style="width: 50%;">
          </div>
        </div>

        <div class="filter-group">
          <label>Skin Tone</label>
          <select id="filter-skin">
            <option value="">Any</option>
            <option value="Fair">Fair</option>
            <option value="Medium">Medium</option>
            <option value="Olive">Olive</option>
            <option value="Brown">Brown</option>
            <option value="Dark">Dark</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Experience Level</label>
          <select id="filter-exp">
            <option value="">Any</option>
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Professional">Professional</option>
          </select>
        </div>
        
        <div class="filter-group">
          <label>Skills</label>
          <div class="checkbox-group">
            <input type="checkbox" id="skill-acting" value="acting">
            <label for="skill-acting" style="margin: 0;">Acting</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="skill-dancing" value="dancing">
            <label for="skill-dancing" style="margin: 0;">Dancing</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="skill-singing" value="singing">
            <label for="skill-singing" style="margin: 0;">Singing</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="skill-painting" value="painting">
            <label for="skill-painting" style="margin: 0;">Painting</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="skill-dubbing" value="dubbing">
            <label for="skill-dubbing" style="margin: 0;">Dubbing</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="skill-swimming" value="swimming">
            <label for="skill-swimming" style="margin: 0;">Swimming</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="skill-driving" value="driving">
            <label for="skill-driving" style="margin: 0;">Driving</label>
          </div>
        </div>

        <button type="button" class="btn-primary" style="width: 100%; margin-top: 1rem;" onclick="applyFilters()">Apply Filters</button>
        <button type="reset" class="btn-secondary" style="width: 100%; margin-top: 0.5rem; padding: 0.5rem;" onclick="setTimeout(applyFilters, 10)">Clear</button>
      </form>
    </aside>

    <main>
      <div style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
        <h2 style="font-size: 1.5rem;">Results <span id="result-count" style="color: var(--text-secondary); font-size: 1rem; font-weight: 500;"></span></h2>
      </div>
      
      <div class="grid grid-3" id="talent-grid">
        <!-- Rendered by JS -->
      </div>
    </main>
  </div>

  <div data-site-footer></div>

  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script>
    let allTalents = [];

    document.addEventListener('DOMContentLoaded', async () => {
      allTalents = await getTalentsFromAPI();
      renderGrid(allTalents);

      // Live search
      document.getElementById('search-name').addEventListener('input', applyFilters);
    });

    function applyFilters() {
      const name = document.getElementById('search-name').value.toLowerCase();
      const gender = document.getElementById('filter-gender').value;
      const minAge = parseInt(document.getElementById('filter-min-age').value);
      const maxAge = parseInt(document.getElementById('filter-max-age').value);
      const skinTone = document.getElementById('filter-skin').value;
      const exp = document.getElementById('filter-exp').value;
      
      const skillActing = document.getElementById('skill-acting').checked;
      const skillDancing = document.getElementById('skill-dancing').checked;
      const skillSinging = document.getElementById('skill-singing').checked;
      const skillPainting = document.getElementById('skill-painting').checked;
      const skillDubbing = document.getElementById('skill-dubbing').checked;
      const skillSwimming = document.getElementById('skill-swimming').checked;
      const skillDriving = document.getElementById('skill-driving').checked;

      const filtered = allTalents.filter(t => {
        if (name && !t.fullName.toLowerCase().includes(name)) return false;
        if (gender && t.gender !== gender) return false;
        if (!isNaN(minAge) && t.age < minAge) return false;
        if (!isNaN(maxAge) && t.age > maxAge) return false;
        if (skinTone && t.physical.skinTone !== skinTone) return false;
        if (exp && t.professional.experienceLevel !== exp) return false;
        
        if (skillActing && !t.skills.acting) return false;
        if (skillDancing && !t.skills.dancing) return false;
        if (skillSinging && !t.skills.singing) return false;
        if (skillPainting && !t.skills.painting) return false;
        if (skillDubbing && !t.skills.dubbing) return false;
        if (skillSwimming && !t.skills.swimming) return false;
        if (skillDriving && !t.skills.driving.canDrive) return false;

        return true;
      });

      renderGrid(filtered);
    }

    function renderGrid(data) {
      const grid = document.getElementById('talent-grid');
      document.getElementById('result-count').textContent = `(${data.length})`;
      
      if (data.length === 0) {
        grid.innerHTML = `<div class="empty-state"><h3>No talents found matching your criteria.</h3><p>Try adjusting your filters.</p></div>`;
        grid.style.display = 'block';
        return;
      }
      
      grid.style.display = 'grid';
      grid.innerHTML = data.map(t => {
        // Names and bios are member-supplied and land in innerHTML, so every
        // interpolation goes through esc(); image URLs go through safeUrl() so
        // a `javascript:` value can't ride in on src. Nested branches are
        // optional because a dashboard-saved listing may omit them entirely.
        const physical = t.physical || {};
        const skills   = t.skills || {};
        const photo    = safeUrl(t.profilePicture) || 'https://via.placeholder.com/400x500?text=No+Photo';
        const meta = [
          physical.height ? `${esc(physical.height)}cm` : null,
          t.gender ? esc(t.gender) : null,
          t.professional?.experienceLevel ? esc(t.professional.experienceLevel) : null,
        ].filter(Boolean).join(' • ');

        return `
        <div class="card talent-card">
          <img src="${photo}" alt="${esc(t.fullName)}">
          <div class="talent-card-info">
            <h3 style="margin-bottom: 0.25rem;">${esc(t.fullName)}</h3>
            <p style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 0.75rem;">
              ${meta || '&nbsp;'}
            </p>
            <div style="margin-bottom: 1rem;">
              ${skills.acting ? '<span class="badge">Acting</span>' : ''}
              ${skills.dancing ? '<span class="badge">Dancing</span>' : ''}
              ${skills.driving?.canDrive ? '<span class="badge">Driver</span>' : ''}
            </div>
            <a href="profile.html?id=${encodeURIComponent(t.id)}" class="btn-secondary" style="display: block; text-align: center; width: 100%;">View Profile</a>
          </div>
        </div>`;
      }).join('');
    }
  </script>
</body>
</html>
