<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — CastingCore</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { min-height:100vh; display:flex; flex-direction:column; }
    .auth-wrapper { flex:1; display:flex; align-items:center; justify-content:center; padding:4rem 1rem; }
    .auth-card { background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:24px; padding:3rem 2.5rem; width:100%; max-width:440px; }
    .auth-card h1 { font-size:2rem; margin-bottom:0.5rem; }
    .form-group { margin-bottom:1.25rem; }
    .form-group label { display:block; font-size:0.85rem; font-weight:500; color:var(--text-secondary); margin-bottom:0.4rem; }
    .form-group input { width:100%; padding:0.85rem 1rem; background:rgba(0,0,0,0.3); border:1px solid var(--border-color); border-radius:10px; color:white; font-family:inherit; font-size:0.95rem; }
    .form-group input:focus { outline:none; border-color:var(--accent-color); }
    .btn-full { width:100%; padding:1rem; font-size:1rem; }
    .auth-link { text-align:center; margin-top:1.25rem; color:var(--text-secondary); font-size:0.9rem; }
    .auth-link a { color:var(--accent-color); font-weight:600; }
    .error-msg { background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.4); color:#f87171; padding:0.75rem 1rem; border-radius:8px; font-size:0.9rem; margin-bottom:1.25rem; display:none; }
    .subtitle { color:var(--text-secondary); margin-bottom:2rem; }
  </style>
</head>
<body>
  <div data-site-nav></div>

<div class="auth-wrapper">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your CastingCore account</p>
      <div class="error-msg" id="error-msg"></div>
      <form id="login-form">
        <div class="form-group">
          <label>Email address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary btn-full" id="login-btn">Sign In</button>
      </form>
      <div class="auth-link">Don't have an account? <a href="register.html">Create one free</a></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Already signed in? The cookie tells us — ask the server rather than
      // guessing from a cached flag.
      if (await fetchCurrentUser()) {
        window.location.href = 'dashboard.html';
        return;
      }

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn   = document.getElementById('login-btn');
        const errEl = document.getElementById('error-msg');
        errEl.style.display = 'none';
        btn.textContent = 'Signing in…'; btn.disabled = true;

        try {
          const res = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include', // receives the httpOnly session cookie
            body: JSON.stringify({
              email:    document.getElementById('email').value,
              password: document.getElementById('password').value,
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Login failed.');

          cacheUser(data.user);
          window.location.href = 'dashboard.html';
        } catch (err) {
          errEl.textContent = err.message; errEl.style.display = 'block';
          btn.textContent = 'Sign In'; btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
